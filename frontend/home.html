<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main</title>
    <script src="js/home.js" defer> </script>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
<div class="left-sidebar">
    <img class = "logo" src="imgs/title.png" alt="Lizard"> 
    <div id="button-home"><button type="button">Home</button></div>
