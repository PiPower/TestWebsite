<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lizard</title>
    <script src="js/login.js" defer> </script>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div id="login_view">
        <img class = "logo" src="imgs/title.png" alt="Lizard"  width="100" height="100"> 
        <div class="login-container">
            <form id="loginForm" method="get">
                <p class = "input-label"> Username or Email </p>
                <input
                    class = "input-field"
                    type="text"
                    id="username"
                    name="login"
                    placeholder="Username or Email"
                    maxlength="50"
                    required
                >
                <p class = "input-label"> Password </p>

                <div class="password-container">
                    <input
                        class = "input-field"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        maxlength="100"
                        required
                    >
                    <div class="forgot-password-container">
                        <a href="#" id="forgotPasswordLink">
                            Forgot password?
                        </a>
                    </div>
                </div>

                <button type="button" class="input-field" id="signInButton">Sign In</button>
                <div class="or-div"> or </div>
                <button type="button" class="input-field" id="registerButton">Create Account</button>
                <div class = "or-div"> 
                New to Lizard? Join the conversation.
                </div>
            </form>
        </div>
    </div>
  <div id = "create-account">
    <div class="login-container">
        <form id="create-account-form">
            <div class="raw-field-margin"> <input
                class = "input-field"
                type="username"
                id="create-username"
                name="create-username"
                placeholder="Username"
                maxlength="50"
                required
            > </div>
            <div class="raw-field-margin"> <input
                class = "input-field"
                type="email"
                id="create-email"
                name="create-email"
                placeholder="Email"
                maxlength="100"
                required
            ></div>
            <div class="raw-field-margin"> <input
                class = "input-field"
                type="password"
                id="create-password"
                name="create-password"
                placeholder="Password"
                maxlength="100"
                required
            ></div>
            <div class="raw-field-margin"> <input
                class = "input-field"
                type="password"
                id="repeat-password"
                name="repeat-password"
                placeholder="Repeat Password"
                maxlength="100"
                required
            ></div>

            <div class="raw-field-margin">
                <button type="button" class="input-field" id="createAccountButton">Create Account</button>
            </div>
        </form>
    </div>
  </div>


</body>
</html>
