<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lizard</title>
    <script src="login.js" defer> </script>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <img class = "logo" src="imgs/title.png" alt="Lizard"  width="100" height="100"> 
    <div class="login-container">
        <form id="loginForm" method="get">
            <p class = "input-label"> Username or Email </p>
            <input
                class = "input-field"
                type="text"
                id="username"
                name="login"
                placeholder="Username or Email"
                required
            >
            <p class = "input-label"> Password </p>

            <div class="password-container">
                <input
                    class = "input-field"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >
                <div class="forgot-password-container">
                    <a href="#" id="forgotPasswordLink">
                        Forgot password?
                    </a>
                </div>
            </div>

            <button type="submit" class="input-field" id="signInButton">Sign In</button>
            <div class="or-div"> or </div>
            <button type="button" class="input-field" id="createAccountButton">Create Account</button>
            New to Lizard? Join the conversation.
        </form>
    </div>
</body>
</html>
